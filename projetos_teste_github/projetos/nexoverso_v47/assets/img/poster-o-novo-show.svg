  <rect width="600" height="900" rx="28" fill="#171717"/>
  <rect x="28" y="28" width="544" height="844" rx="22" fill="none" stroke="#666" stroke-width="3"/>
  <text x="300" y="170" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">O NOVO SHOW</text>
  <text x="300" y="220" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="25">DO SCOOBY-DOO</text>
  <text x="300" y="258" text-anchor="middle" fill="#ddd" font-family="Arial, sans-serif" font-size="22">E SCOOBY-LOO</text>
